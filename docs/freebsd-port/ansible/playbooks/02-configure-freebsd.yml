---
# Playbook: Configure FreeBSD VMs (post-boot verification and additional setup)
#
# Run: ansible-playbook playbooks/02-configure-freebsd.yml

- name: Verify and Configure FreeBSD VMs
  hosts: freebsd_cluster
  gather_facts: yes

  tasks:
    - name: Wait for setup to complete
      tags: [verify, setup]
      wait_for:
        path: /root/.setup_complete
        timeout: 300

    - name: Verify ZFS pool
      tags: [verify, zfs]
      command: zpool status tbpool
      register: zpool_status
      changed_when: false

    - name: Display ZFS status
      tags: [verify, zfs]
      debug:
        var: zpool_status.stdout_lines

    - name: Verify AIO module loaded
      tags: [verify, aio]
      shell: kldstat | grep -q aio
      changed_when: false

    - name: Verify network configuration
      tags: [verify, network]
      debug:
        msg: "{{ inventory_hostname }} is reachable at {{ ansible_host }}"

    - name: Install Zig
      tags: [zig, install]
      block:
        - name: Check if Zig is installed
          command: zig version
          register: zig_check
          ignore_errors: yes
          changed_when: false

        - name: Download Zig
          get_url:
            url: "https://ziglang.org/download/{{ zig_version }}/zig-freebsd-x86_64-{{ zig_version }}.tar.xz"
            dest: /tmp/zig.tar.xz
          when: zig_check is failed

        - name: Extract Zig
          unarchive:
            src: /tmp/zig.tar.xz
            dest: /tmp/
            remote_src: yes
          when: zig_check is failed

        - name: Install Zig
          shell: |
            rm -rf /usr/local/zig
            mv /tmp/zig-freebsd-x86_64-{{ zig_version }} /usr/local/zig
            ln -sf /usr/local/zig/zig /usr/local/bin/zig
          when: zig_check is failed

        - name: Verify Zig installation
          command: zig version
          register: zig_version_check
          changed_when: false

        - name: Display Zig version
          debug:
            msg: "Zig {{ zig_version_check.stdout }} installed"
